<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đồng hồ Pomodoro</title>
    <!-- Khởi tạo màu chủ đạo ngay lập tức để tránh chớp màu -->
    <script>
        (function() {
            try {
                const savedColor = localStorage.getItem('k71_theme_color') || '#e58547';
                const savedTheme = localStorage.getItem('k71_theme') || 'dark';
                
                function hexToRgb(hex) {
                    hex = hex.replace('#', '');
                    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
                    const num = parseInt(hex, 16);
                    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
                }
                function adjustBrightness(hex, percent) {
                    const { r, g, b } = hexToRgb(hex);
                    const amt = Math.round(2.55 * percent);
                    const R = Math.min(255, Math.max(0, r + amt));
                    const G = Math.min(255, Math.max(0, g + amt));
                    const B = Math.min(255, Math.max(0, b + amt));
                    return '#' + ((1 << 24) + (R << 16) + (G << 8) + B).toString(16).slice(1);
                }
                
                const rgb = hexToRgb(savedColor);
                const rgbStr = `${rgb.r}, ${rgb.g}, ${rgb.b}`;
                const hoverHex = adjustBrightness(savedColor, -15);
                
                document.documentElement.style.setProperty('--primary-color', savedColor);
                document.documentElement.style.setProperty('--primary-hover', hoverHex);
                document.documentElement.style.setProperty('--primary-rgb', rgbStr);
                
                if (savedTheme === 'light') {
                    document.documentElement.classList.add('light-mode');
                }
            } catch(e) {}
        })();
    </script>
    <style>
        :root {
            --primary-color: #e58547;
            --primary-hover: #cf7337;
            --primary-rgb: 229, 133, 71;
            --bg: transparent;
            --card-btn: #1f1a16;
            --text: #ede3da;
            --text-muted: #ad9e92;
            --border: #2b231d;
        }

        .light-mode {
            --text: #1e293b;
            --text-muted: #64748b;
            --card-btn: #ffffff;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: var(--bg); 
            color: var(--text);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            transition: color 0.25s ease;
        }
        
        .timer-display { 
            font-size: 3.8rem; 
            font-weight: 800; 
            color: var(--primary-color); 
            margin: 15px 0; 
            letter-spacing: 2px;
            text-shadow: 0 0 25px rgba(var(--primary-rgb), 0.35);
            transition: color 0.25s ease, text-shadow 0.25s ease;
        }
        
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
        
        button {
            padding: 9px 16px;
            border: 1px solid var(--border);
            background: var(--card-btn);
            color: var(--text-muted);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover { 
            background: rgba(var(--primary-rgb), 0.12); 
            color: var(--primary-color); 
            border-color: var(--primary-color); 
        }
        button.active { 
            background: var(--primary-color); 
            color: #ffffff; 
            border-color: var(--primary-color);
            box-shadow: 0 4px 14px rgba(var(--primary-rgb), 0.4);
        }
        
        .controls { display: flex; gap: 12px; margin-top: 5px; }
        .btn-main { padding: 11px 28px; font-size: 1rem; border-radius: 20px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-start { 
            background: var(--primary-color); 
            color: #ffffff; 
            box-shadow: 0 4px 14px rgba(var(--primary-rgb), 0.4); 
            transition: all 0.2s;
        }
        .btn-start:hover { 
            background: var(--primary-hover); 
            transform: translateY(-2px); 
        }
        .btn-reset { background: #362d26; color: #ffffff !important; border: 1px solid #4a3e35; }
        .btn-reset:hover { background: #4a3e35; color: #ffffff !important; }
        
        .light-mode .btn-reset { background: #475569; color: #ffffff !important; border-color: #334155; }
        .light-mode .btn-reset:hover { background: #334155; color: #ffffff !important; }
    </style>
</head>
<body>

    <div class="btn-group">
        <button onclick="setTimer(25, this)" class="active">25 Phút</button>
        <button onclick="setTimer(45, this)">45 Phút</button>
        <button onclick="setTimer(60, this)">60 Phút</button>
        <button onclick="setTimer(5, this)">Nghỉ 5P</button>
        <button onclick="setTimer(15, this)">Nghỉ 15P</button>
    </div>

    <div class="timer-display" id="time">25:00</div>

    <div class="controls">
        <button class="btn-main btn-start" id="startBtn" onclick="toggleTimer()">Bắt đầu</button>
        <button class="btn-main btn-reset" onclick="resetTimer()">Đặt lại</button>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let timerId = null;
        let defaultTime = 25 * 60;

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('time').innerText = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function setTimer(minutes, btnElement) {
            clearInterval(timerId);
            timerId = null;
            document.getElementById('startBtn').innerText = 'Bắt đầu';
            defaultTime = minutes * 60;
            timeLeft = defaultTime;
            updateDisplay();

            document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
        }

        function toggleTimer() {
            const startBtn = document.getElementById('startBtn');
            if (timerId === null) {
                timerId = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerId);
                        timerId = null;
                        alert('Đã hết giờ tập trung! Hãy nghỉ ngơi chút nhé.');
                        startBtn.innerText = 'Bắt đầu';
                    }
                }, 1000);
                startBtn.innerText = 'Tạm dừng';
            } else {
                clearInterval(timerId);
                timerId = null;
                startBtn.innerText = 'Tiếp tục';
            }
        }

        function resetTimer() {
            clearInterval(timerId);
            timerId = null;
            timeLeft = defaultTime;
            updateDisplay();
            document.getElementById('startBtn').innerText = 'Bắt đầu';
        }

        /* ===== ĐỒNG BỘ MÀU CHỦ ĐẠO TOÀN CỤC (GLOBAL THEME SYNC) ===== */
        function setThemeColor(hex) {
            if (!hex) return;
            function hexToRgb(h) {
                h = h.replace('#', '');
                if (h.length === 3) h = h.split('').map(c => c + c).join('');
                const num = parseInt(h, 16);
                return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
            }
            function adjustBrightness(h, percent) {
                const { r, g, b } = hexToRgb(h);
                const amt = Math.round(2.55 * percent);
                const R = Math.min(255, Math.max(0, r + amt));
                const G = Math.min(255, Math.max(0, g + amt));
                const B = Math.min(255, Math.max(0, b + amt));
                return '#' + ((1 << 24) + (R << 16) + (G << 8) + B).toString(16).slice(1);
            }
            const rgb = hexToRgb(hex);
            const rgbStr = `${rgb.r}, ${rgb.g}, ${rgb.b}`;
            const hoverHex = adjustBrightness(hex, -15);
            document.documentElement.style.setProperty('--primary-color', hex);
            document.documentElement.style.setProperty('--primary-hover', hoverHex);
            document.documentElement.style.setProperty('--primary-rgb', rgbStr);
        }

        function setThemeMode(mode) {
            if (mode === 'light') {
                document.documentElement.classList.add('light-mode');
            } else {
                document.documentElement.classList.remove('light-mode');
            }
        }

        window.setThemeColor = setThemeColor;
        window.setThemeMode = setThemeMode;

        // Nhận tín hiệu đổi màu từ trang cha (index.html)
        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'THEME_SYNC') {
                if (e.data.color) setThemeColor(e.data.color);
                if (e.data.mode) setThemeMode(e.data.mode);
            }
        });

        // Nhận tín hiệu khi đổi màu từ tab khác
        window.addEventListener('storage', (e) => {
            if (e.key === 'k71_theme_color' && e.newValue) setThemeColor(e.newValue);
            if (e.key === 'k71_theme' && e.newValue) setThemeMode(e.newValue);
        });
    </script>
</body>
</html>
