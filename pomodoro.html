<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đồng hồ Pomodoro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .pomo-card {
            background: #ffffff;
            padding: 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
        }
        
        .mode-tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
        .tab-btn {
            background: #edf2f7; border: none; padding: 6px 12px; border-radius: 20px;
            font-size: 0.8rem; color: #4a5568; cursor: pointer; transition: all 0.2s;
        }
        .tab-btn.active { background: #007bff; color: white; font-weight: 600; }
        
        .timer-display {
            font-size: 3.5rem; font-weight: 700; color: #2d3748; margin: 10px 0;
            font-variant-numeric: tabular-nums;
        }
        
        .controls { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        .ctrl-btn {
            border: none; padding: 10px 20px; border-radius: 8px; font-size: 0.9rem;
            font-weight: 600; cursor: pointer; transition: transform 0.1s, background 0.2s;
        }
        .ctrl-btn:active { transform: scale(0.96); }
        .btn-start { background: #28a745; color: white; }
        .btn-pause { background: #ffc107; color: #333; display: none; }
        .btn-reset { background: #e2e8f0; color: #4a5568; }
    </style>
</head>
<body>

<div class="pomo-card">
    <div class="mode-tabs">
        <button class="tab-btn active" onclick="switchMode(25, this)">Học tập (25m)</button>
        <button class="tab-btn" onclick="switchMode(5, this)">Nghỉ ngắn (5m)</button>
        <button class="tab-btn" onclick="switchMode(15, this)">Nghỉ dài (15m)</button>
    </div>

    <div class="timer-display" id="timer">25:00</div>

    <div class="controls">
        <button class="ctrl-btn btn-start" id="startBtn" onclick="startTimer()">Bắt đầu</button>
        <button class="ctrl-btn btn-pause" id="pauseBtn" onclick="pauseTimer()">Tạm dừng</button>
        <button class="ctrl-btn btn-reset" onclick="resetTimer()">Đặt lại</button>
    </div>
</div>

<script>
    let duration = 25 * 60;
    let timeLeft = duration;
    let timerId = null;

    const timerDisplay = document.getElementById('timer');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    function updateDisplay() {
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        timerDisplay.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function startTimer() {
        if (timerId !== null) return;
        startBtn.style.display = 'none';
        pauseBtn.style.display = 'inline-block';
        
        timerId = setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                updateDisplay();
            } else {
                clearInterval(timerId);
                timerId = null;
                alert("🎉 Đã hoàn thành phiên tập trung! Hãy nghỉ ngơi nào.");
                resetTimer();
            }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerId);
        timerId = null;
        startBtn.style.display = 'inline-block';
        pauseBtn.style.display = 'none';
    }

    function resetTimer() {
        pauseTimer();
        timeLeft = duration;
        updateDisplay();
    }

    function switchMode(minutes, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        duration = minutes * 60;
        resetTimer();
    }

    updateDisplay();
</script>
</body>
</html>
